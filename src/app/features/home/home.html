<section class="hero surface-green">
  <div class="hero__inner container">
    <!-- Anchored to the capped content column, not the full-bleed section, so
         the plates stay next to the headline instead of drifting to the far
         screen edge on ultra-wide displays. -->
    <div class="hero__plates" aria-hidden="true">
      <img class="plate" src="/images/plate-chicken-greenbeans.webp"
        width="654" height="642" alt="" />
      <img class="plate" src="/images/plate-salmon-salad.webp"
        width="855" height="847" alt="" />
      <img class="plate" src="/images/plate-steak-wedges.webp"
        width="878" height="900" alt="" />
      <img class="plate" src="/images/plate-chicken-quinoa.webp"
        width="896" height="900" alt="" />
      <img class="plate" src="/images/plate-salmon-asparagus.webp"
        width="899" height="900" alt="" />
    </div>

    <header class="hero__top"><app-logo variant="light" /></header>

    <div class="hero__body">
      <div class="hero__text">
        <p class="hero__eyebrow">AI-Powered recipe generator</p>
        <h1 class="hero__title">Code à Cuisine</h1>
        <a class="btn btn-cream hero__cta" routerLink="/generate" (click)="startNewRun()">Get started</a>
      </div>
    </div>

    <div class="hero__foot">
      <span class="hero__foot-title">Hungry for inspiration?</span>
      <a class="link-arrow" routerLink="/cookbook">
        Go to cookbook
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 12h15m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </div>
</section>
