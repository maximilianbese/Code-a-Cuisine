<section class="loading surface-green">
  <header class="loading__top container"><app-logo variant="light" /></header>
  <div class="loading__center">
    <div class="loading__card">
      @if (!animationFailed()) {
        <img class="loading__anim" src="/images/loading-spinner.webp" alt=""
          aria-hidden="true" (error)="animationFailed.set(true)" />
      }
    </div>
    <h1 class="loading__text">Generating<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
  </div>
</section>
